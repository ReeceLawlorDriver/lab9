name: Basic Tests Workflow

on:
  push:
    branches: [ "main", "master", "test" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lab9-basic-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x validate-data.sh

      - name: Test 1 - Valid input (PASS)
        run: ./validate-data.sh "pearse mccarthy" "0831122334"

      - name: Test 2 - Invalid mobile length (FAIL expected)
        run: |
          output=$(./validate-data.sh "pearse mccarthy" "08311223344")
          echo "$output"
          if [ "$output" != "FAIL" ]; then exit 1; fi

      - name: Test 3 - Invalid name length (FAIL expected)
        run: |
          output=$(./validate-data.sh "pearseT mccarthy" "0831122334")
          echo "$output"
          if [ "$output" != "FAIL" ]; then exit 1; fi
